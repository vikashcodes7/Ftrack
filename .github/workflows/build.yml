name: Build FTrack
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 20}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: 17}
      - run: unzip -o ftrack.zip -d app
      - run: mkdir -p ~/.android && cp app/debug.keystore ~/.android/debug.keystore
      - run: cd app && npm install && npx cap add android && npx cap sync android
      - run: cd app/android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ftrack-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
